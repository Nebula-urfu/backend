name: Backend
on: [push, pull_request]
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - run: nix flake check
      - run: nix develop --command uv sync --locked
      - run: nix develop --command bash -ec 'PYTHONPATH=. uv run --locked python scripts/export_openapi.py > /tmp/openapi.json; diff -u openapi.json /tmp/openapi.json'
      - run: nix develop --command scripts/test-postgres.sh
      - run: docker build -t nebula-backend:ci .
